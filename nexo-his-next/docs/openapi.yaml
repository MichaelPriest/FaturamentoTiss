openapi: 3.0.3
info:
  title: Nexo Hospitalar - API Financeira
  version: 1.0.0
  description: API transacional de contas hospitalares, remessas, retornos, glosas e recursos.
servers: [{ url: / }]
security: [{ bearerAuth: [] }]
paths:
  /api/faturamento/gerar-conta/{id_guia}:
    post:
      summary: Consolida a conta de uma guia
      parameters: [{ in: path, name: id_guia, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Conta consolidada }, '422': { $ref: '#/components/responses/Error' } }
  /api/faturamento/gerar-remessa:
    post:
      summary: Gera uma remessa para contas fechadas
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GerarRemessa' } } }
      responses: { '200': { description: Remessa gerada }, '422': { $ref: '#/components/responses/Error' } }
  /api/faturamento/processar-retorno:
    post:
      summary: Concilia retorno validado contra o XSD do convênio
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [id_remessa, xml], properties: { id_remessa: { type: string, format: uuid }, xml: { type: string, maxLength: 10485760 } } } } }
      responses: { '200': { description: Retorno processado }, '400': { $ref: '#/components/responses/Error' } }
  /api/glosas:
    get:
      summary: Pesquisa glosas da unidade
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDENTE, RECORRIDO, ACEITO, JULGADO] } }
        - { in: query, name: operadora, schema: { type: integer, format: int64 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses: { '200': { description: Página de glosas } }
  /api/glosas/{id}/recurso:
    post:
      summary: Abre recurso com documentação obrigatória
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Recurso' } } }
      responses: { '200': { description: Recurso aberto }, '422': { $ref: '#/components/responses/Error' } }
  /api/dashboard/financeiro:
    get: { summary: Indicadores financeiros da unidade, responses: { '200': { description: Indicadores consolidados } } }
  /api/relatorios/glosas-por-motivo:
    get: { summary: Glosas agrupadas pela terminologia ANS importada, responses: { '200': { description: Causas e participação financeira } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  responses: { Error: { description: Erro validado, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } } }
  schemas:
    GerarRemessa:
      type: object
      required: [id_operadora, data_inicio, data_fim]
      properties: { id_operadora: { type: integer, format: int64 }, data_inicio: { type: string, format: date }, data_fim: { type: string, format: date } }
    Recurso:
      type: object
      required: [justificativa, anexos]
      properties:
        justificativa: { type: string, minLength: 20 }
        anexos:
          type: array
          minItems: 3
          items: { type: object, required: [tipo, url], properties: { tipo: { type: string, enum: [prontuario, guia, laudo] }, url: { type: string, format: uri } } }
